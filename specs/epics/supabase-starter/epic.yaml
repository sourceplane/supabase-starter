# The epic's declaration. metadata.name equals the directory name; metadata.key
# is the task-key prefix this epic reserves (SS → SS-1, SS-2, …). Owner, target
# date and health are the platform's — never written here.
apiVersion: orun.io/v1
kind: Epic
metadata:
  name: supabase-starter
  key: SS
spec:
  title: "Vercel's Next.js + Supabase Starter on Cloudflare Workers"
  summary: "The Vercel with-supabase template — Supabase Auth with cookie-based sessions through @supabase/ssr, a session-refreshing proxy, sign-up/login/password flows and a protected page — runs on Cloudflare Workers + Static Assets through @opennextjs/cloudflare, with the Supabase project itself provisioned by Terraform through Orun (the Lumen baseline's supabase root) and its URL and publishable key wired into the build and the Worker per environment. It is the Cloudflare + Supabase port the coverage analysis ranks first: the template already speaks Supabase, so nothing in its code changes."
  state: started
  milestones:
    - name: "SS0 — the spec"
      exitCriteria:
        - "the doc set and the task contracts are on main"
      tasks: [SS-1]
    - name: "SS1 — the starter on Workers"
      exitCriteria:
        - "apps/web is the upstream template, built by `next build` + `opennextjs-cloudflare build`"
        - "the wrangler config renders per environment from the supabase root's wiring document (fixture in verify, live in deploy)"
        - "`pnpm typecheck`, `pnpm lint`, `pnpm test` and `pnpm build` are green on main (Checks)"
        - "`wrangler dev` serves the home page and sends a signed-out visitor of /protected to /auth/login"
      tasks: [SS-2]
    - name: "SS2 — the Supabase project from Terraform"
      exitCriteria:
        - "infra/terraform/supabase provisions the stage and prod projects and publishes URL, anon and service-role keys as orun secrets"
        - "the app component declares the build-time env and the wiring it needs from that root"
      tasks: [SS-3]
    - name: "SS3 — ready to instantiate"
      exitCriteria:
        - "the README says how to run, test, preview and deploy it through Orun, and how auth email redirects are configured"
        - "the as-built status records every departure from the upstream template"
      tasks: [SS-4]
    - name: "SS4 — a baseline"
      exitCriteria:
        - "blueprint.yaml (the console card, requires [github, cloudflare, supabase]) and repo-blueprint.yaml (the build) take a new product from nothing to live on stage and prod in ONE landing, then record it (01-product, 02-docs)"
        - "the product's own push-to-main plan converges supabase → web per environment, the edge enforced on main and advisory on a pull request"
        - "the supabase root publishes WIRING_SUPABASE beside Lumen's three credentials and points each project's Auth at its Worker, so a fresh product signs a user up on its first deploy with no SMTP server"
        - "the tutorial's table has row-level security keyed on auth.uid(); the e2e proves each user reads only their own rows and anon none"
        - "Baseline CI is green: contract tests, the blueprint read by the pinned orun, the leak gate, the offline bootstrap and the product's plans, and the end-to-end tier"
      tasks: [SS-5]
    - name: "SS5 — the product's own origin"
      exitCriteria:
        - "every page's og:image and twitter:image are absolute URLs on the product's own origin — the environment's workers.dev URL, or its SITE_URL — never localhost"
        - "SITE_URL is one setting: the build's metadataBase and the Supabase project's Auth Site URL both follow it"
        - "the product offers its visitors no Deploy to Vercel button"
        - "the e2e tier asserts both on the served home page"
      tasks: [SS-6]
    - name: "SS6 — the cirrus standard"
      exitCriteria:
        - "nothing outside this milestone's own record names kiox: orun is pinned where CI runs it (the orun-action `version:` in each workflow)"
        - "every component carries generated docs/{overview,architecture,runbook}.md, and Baseline CI fails a pull request whose manifests and pages disagree"
        - "ai/context carries this repository's current.md, decisions.md and open-risks.md, and none of them ships to a product"
        - "every milestone's status row agrees with the tags"
      tasks: [SS-7]
