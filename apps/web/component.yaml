apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The Next.js + Supabase starter (Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  domain: web
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # INFRA BEFORE APP, ENFORCED ON MAIN. A merge to main converges the whole
  # product in one run: the Supabase project, then this Worker. Its build
  # reads the project's URL and publishable key (WIRING_SUPABASE_<ENV>,
  # rendered into wrangler.jsonc and inlined by `next build`), and a job
  # resolves its secrets when it STARTS — so it waits on the apply,
  # `mode: enforced`, and the document the apply lease-published is there. A
  # pull request deploys nothing, so nothing on one waits: the edge is
  # advisory there.
  dependsOn:
    - component: supabase
      mode: enforced
      modeRules:
        - mode: advisory
          when:
            triggerRef: github-pull-request
  # The wiring documents the supabase root lease-publishes, one per deployed
  # environment; tooling/wire/live.mjs picks this job's and fails loudly when
  # it is not there. OPTIONAL references, so a job resolves the ones that
  # exist: stage's deploy waits on stage's apply only, and while the bootstrap
  # runs stage and prod side by side, prod's document may not be published yet
  # when stage's deploy starts (a required reference would fail that job). The
  # dev verify lane renders nothing and reads neither.
  optionalSecretEnv:
    WIRING_SUPABASE_STAGE: "secret://supabase-starter/supabase-starter/stage/WIRING_SUPABASE"
    WIRING_SUPABASE_PROD: "secret://supabase-starter/supabase-starter/prod/WIRING_SUPABASE"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: supabase-starter-web-{dev,stage,prod}.
    workerName: supabase-starter-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}. The supabase
    # root carries the same value: Auth's Site URL is this Worker.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # wrangler.jsonc is COMMITTED — the fixture render, so the composition's
    # structure check (`test -f wrangler.jsonc`, before the build, in a fresh
    # checkout) passes. Stage and prod re-render it here, in their own job
    # tree, from this environment's wiring document, so the Worker's vars and
    # the URL and key `next build` inlines are the real project's; dev
    # verifies with the fixture and has no wiring.
    #
    # The product's public origin (the Open Graph and Twitter image links are
    # absolute): the environment's SITE_URL when intent.yaml sets one (a
    # custom domain), else its workers.dev URL — the same origin the supabase
    # root gives the project's Auth as its Site URL. The subdomain is written
    # out rather than read from ${WORKERS_DEV_SUBDOMAIN}: the composition
    # exports that to the smoke step only, so the build would see it empty.
    # ${ORUN_ENVIRONMENT} the runner sets for every step.
    buildCommand: if [ "${ORUN_ENVIRONMENT}" != dev ]; then node ../../tooling/wire/live.mjs --template wrangler.template.jsonc --out wrangler.jsonc --components supabase --env "${ORUN_ENVIRONMENT}"; fi && NEXT_PUBLIC_SITE_URL="${SITE_URL:-https://supabase-starter-web-${ORUN_ENVIRONMENT}.your-workers-subdomain.workers.dev}" pnpm exec turbo run build --filter=@app/web

    # Smoke: the home page renders, signed-out header included, and
    # /api/health answers ok — the project's Auth reachable with the key this
    # build inlined. Each response is buffered before grep so an early match
    # cannot SIGPIPE curl.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q 'href=\"/auth/sign-up\"' && health=$(curl -sf \"${DEPLOYED_URL}/api/health\") && echo \"${health}\" | grep -q '\"ok\":true'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
