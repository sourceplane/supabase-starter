apiVersion: sourceplane.io/v1
kind: Component
metadata:
  name: web
  description: The Next.js + Supabase starter (Next.js on Cloudflare Workers + Static Assets via @opennextjs/cloudflare, per environment)
spec:
  type: cloudflare-workers-assets-turbo
  lifecycle: production
  owner: platform
  domain: web
  path: apps/web
  # Its own lane per environment: the Next.js build is the longest job in the
  # plan, and a shared lane would wait on it.
  lane: isolated
  # The Supabase project must exist before this deploys: its URL and
  # publishable key are read at build time (NEXT_PUBLIC_* are inlined) and
  # rendered into wrangler vars for the Worker.
  dependsOn:
    - component: supabase
  secretEnv:
    NEXT_PUBLIC_SUPABASE_URL: "secret://supabase-starter/supabase-starter/{{ .environment }}/SUPABASE_URL"
    NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: "secret://supabase-starter/supabase-starter/{{ .environment }}/SUPABASE_ANON_KEY"
    WIRING_SUPABASE_STAGE: "secret://supabase-starter/supabase-starter/stage/WIRING_SUPABASE"
    WIRING_SUPABASE_PROD: "secret://supabase-starter/supabase-starter/prod/WIRING_SUPABASE"
  subscribe:
    environments:
      - name: dev
        profile: verify
      - name: stage
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
      - name: prod
        profile: verify
        profileRules:
          - profile: deploy
            when:
              triggerRef: github-push-main
  parameters:
    nodeVersion: "22"
    pnpmVersion: "10.12.1"

    workspaceDir: ../..
    appDir: .

    turboFilter: "@app/web"
    wranglerConfig: wrangler.jsonc

    # @opennextjs/cloudflare emits a Worker entrypoint plus a static-assets
    # directory bound via ASSETS — both deploy in one `wrangler deploy`.
    workerEntrypoint: .open-next/worker.js
    assetsDir: .open-next/assets

    # Per-env worker name: supabase-starter-web-{dev,stage,prod}.
    workerName: supabase-starter-web
    environmentAwareWorkerName: true

    # The account's workers.dev subdomain; exported to the smoke step as
    # ${WORKERS_DEV_SUBDOMAIN} and used to build ${DEPLOYED_URL}.
    workersDevSubdomain: your-workers-subdomain

    installCommand: pnpm install --frozen-lockfile
    # Render this environment's wrangler config from the wiring document, then
    # build (the verify lane already rendered from the fixture through
    # `wire:fixture`; a deploy lane re-renders with the real values).
    buildCommand: node ../../tooling/wire/live.mjs --template wrangler.template.jsonc --out wrangler.jsonc --components supabase --env "${ORUN_ENVIRONMENT}" && pnpm exec turbo run build --filter=@app/web

    # Smoke: the home page renders and carries the app's marker text.
    smokeCommand: "html=$(curl -sfL \"${DEPLOYED_URL}/\") && echo \"${html}\" | grep -q 'Next.js and Supabase Starter Kit'"
  labels:
    team: platform
    layer: delivery
    surface: web
    runtime: cloudflare
